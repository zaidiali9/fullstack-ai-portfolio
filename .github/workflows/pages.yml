name: portfolio-site

# Publishes portfolio-site/ (static HTML, no build step) to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["portfolio-site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-site
      - id: deployment
        uses: actions/deploy-pages@v4
